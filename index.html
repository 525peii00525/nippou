<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
    <title>日報メーカー</title>
    <link rel="stylesheet" href="./style.css?v=2">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <h1>日報メーカー</h1>
    <p>今日の内容を入力して、Slack に貼り付けます。</p>
    <form id="report">
      <details id="settings" open>
        <summary>勤務設定（初回・変更時）</summary>
        <fieldset>
          <legend>基本情報</legend>
          <div class="row">
            <label>
              PJ 名
              <input id="project" required placeholder="○○システム保守開発">
            </label>
            <label>
              常駐先企業名
              <input id="client" required placeholder="○○ソリューション(株)">
            </label>
          </div>
          <div class="row">
            <label>
              拠点
              <input id="site" required placeholder="渋谷">
            </label>
            <label>
              稼働見込み時間（h）
              <input id="hours" type="number" min="0" step="any" value="180" required>
            </label>
          </div>
          <label>
            <input type="checkbox" id="remember">
            この端末に基本情報・勤務時間・勤務形態を保存
          </label>
          <small>チェックした状態でコピーした値を、次回の初期値にします。チェックを外すと保存設定を消去します。</small>
        </fieldset>
      </details>
      <fieldset>
        <legend>今日の内容</legend>
        <div class="row">
          <label>
            日付
            <input id="day" type="date" required>
          </label>
          <label>
            出勤
            <input id="start" type="time" required>
          </label>
          <label>
            退勤
            <input id="end" type="time" required>
          </label>
          <label>
            勤務形態
            <select id="mode" required>
              <option value="">選択してください</option>
              <option>出社</option>
              <option>在宅</option>
              <option>出社/在宅</option>
            </select>
          </label>
        </div>
        <div class="work-heading">
          <label for="work">作業内容・工程・技術やツール</label>
          <label class="reuse-work" title="コピー時に作業内容をこの端末に保存します">
            <input type="checkbox" id="rememberWork">
            次回も使う
          </label>
        </div>
        <textarea id="work" rows="3" required></textarea>
        <label>
          所感・現場の状況
          <textarea id="note" rows="2" required></textarea>
        </label>
      </fieldset>
      <button type="submit">日報をコピー</button>
      <span id="status" role="status"></span>
    </form>
    <label>
      Slack 投稿プレビュー
      <textarea id="preview" rows="15" readonly></textarea>
    </label>
  </body>
</html>
